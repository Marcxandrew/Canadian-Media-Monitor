# ============================================================
# Canadian Media Monitor — Configuration
# ============================================================

# ── Claude settings ─────────────────────────────────────────
claude:
  model: claude-sonnet-4-6
  max_output_tokens: 8000
  max_articles_per_call: 40

# ── Filter settings ─────────────────────────────────────────
filter:
  min_relevant_articles: 3   # skip email if fewer than this many articles matched

# ── Priority regions (kept first if article cap is hit) ─────
priority_regions:
  - Quebec
  - National
  - Alberta

# ── Email delivery ──────────────────────────────────────────
email:
  subject_template: "Morning Media Brief — {date}"
  from_address: "iedm.mediabrief@gmail.com"
  smtp_host: "smtp.gmail.com"
  smtp_port: 587
  recipients:
    - marcandrew.erian@gmail.com

# ── Exclusion keywords ──────────────────────────────────────
# Articles whose title OR RSS summary contains any of these
# are dropped before topic matching — they never reach Claude.
exclude_keywords:
  # Crime & police
  - police
  - shooting
  - homicide
  - murder
  - assault
  - stabbing
  - gunshot
  - gunfire
  - ASIRT
  - "officer-involved"
  - "officer involved"
  - fusillade
  - meurtre
  - "faits divers"
  - "coups de feu"
  - agression
  # Sports
  - NHL
  - LNH
  - NBA
  - CFL
  - MLS
  - NFL
  - "Stanley Cup"
  - "Coupe Stanley"
  - "Grey Cup"
  - "Memorial Cup"
  - roster
  - "player trade"

