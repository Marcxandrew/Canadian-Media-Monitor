# ============================================================
# Canadian Media Monitor — Configuration
# ============================================================

claude:
  model: claude-sonnet-4-6
  max_output_tokens: 8000
  max_articles_per_call: 40

filter:
  min_relevant_articles: 3

priority_regions:
  - Quebec
  - National
  - Alberta

email:
  subject_template: "Morning Media Brief — {date}"
  from_address: "iedm.mediabrief@gmail.com"
  smtp_host: "smtp.gmail.com"
  smtp_port: 587
  recipients:
    - marcandrew.erian@gmail.com
    - rbrossard@iedm.org
    - nradenkovic@iedm.org
    - fplourde@iedm.org
    - merian@iedm.org
    - glucyshyn@iedm.org

exclude_keywords:
  - police
  - shooting
  - homicide
  - murder
  - assault
  - stabbing
  - gunshot
  - gunfire
  - ASIRT
  - "officer-involved"
  - "officer involved"
  - fusillade
  - meurtre
  - "faits divers"
  - "coups de feu"
  - agression
  - NHL
  - LNH
  - NBA
  - CFL
  - MLS
  - NFL
  - "Stanley Cup"
