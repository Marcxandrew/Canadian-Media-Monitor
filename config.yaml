priority_regions: [alberta, quebec]

# Articles are automatically excluded if their title or summary contains ANY of these terms.
# This runs before keyword matching — excluded articles never reach Claude.
exclude_keywords:
  # Crime & police
  - police
  - shooting
  - homicide
  - murder
  - assault
  - stabbing
  - gunshot
  - gunfire
  - ASIRT
  - "officer-involved"
  - "officer involved"
  - fusillade
  - meurtre
  - "faits divers"
  - "coups de feu"
  - agression
  # Sports
  - NHL
  - LNH
  - NBA
  - CFL
  - MLS
  - NFL
  - "Stanley Cup"
  - "Coupe Stanley"
  - "Grey Cup"
  - "Memorial Cup"
  - roster
  - "player trade"

email:
  smtp_host: smtp.gmail.com
  smtp_port: 587
  from_address: iedm.mediabrief@gmail.com
  recipients:
    - marcandrew.erian@gmail.com
    - fplourde@iedm.org
    - nradenkovic@iedm.org
    - ppasschier@iedm.org
    - rbrossard@iedm.org
  subject_template: "Morning Media Brief — {date}"

claude:
  model: claude-sonnet-4-6
  max_articles_per_call: 80
  max_output_tokens: 8000

filter:
  lookback_hours: 24
  min_relevant_articles: 3
  fetch_full_text: false   # off by default — RSS summaries are enough for clippings
